name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v3
        with:
          enable-cache: true

      - name: Set up Python
        run: uv python install 3.12

      - name: Install dependencies
        run: |
          uv venv
          uv pip install -e '.[dev,media,figures]'

      - name: Run Ruff Linter
        run: |
          uvx ruff check src scripts docxplus_cli.py

      - name: Run Test Suite with Coverage Gate (>=90%)
        run: |
          .venv/bin/python -m pytest --cov=src -q

      - name: Verify Manuscript Variables & Rendering
        run: |
          .venv/bin/python scripts/z_generate_manuscript_variables.py
          .venv/bin/python scripts/render_manuscript.py
