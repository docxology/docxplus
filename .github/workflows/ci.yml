name: CI

on:
  push:
    branches: [ main ]
    tags: [ 'v*' ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # actions/checkout@v7.0.1
        with:
          persist-credentials: false

      - name: Install uv
        uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # astral-sh/setup-uv@v10.3.3
        with:
          enable-cache: true
          version: '0.13.7'

      - name: Set up Python
        run: uv python install

      - name: Install dependencies
        run: |
          uv sync --locked --all-extras
          .venv/bin/python --version

      - name: Qualify Linux reproduction sandbox
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends bubblewrap
          bwrap --unshare-user --unshare-net --ro-bind / / true

      - name: Run Ruff Linter
        # Run the ruff the `dev` extra pins, not `uvx ruff` — an unpinned gate
        # re-litigated the same findings on every ruff release.
        run: |
          .venv/bin/python -m ruff check src scripts tests

      - name: Run Test Suite with Coverage Gate (>=90%)
        run: |
          .venv/bin/python -m pytest --cov=src -q

      - name: Verify Manuscript Variables & Rendering
        run: |
          .venv/bin/python scripts/z_generate_manuscript_variables.py
          .venv/bin/python scripts/render_manuscript.py
